/* ---------- swipe sideways between tabs ----------
   Touch only: a mouse drag selects text, and a trackpad's sideways swipe is the browser's back/forward.
   The panels let the browser pan only vertically (touch-action: pan-y), so a mostly vertical drag stays a scroll
   and a sideways one reaches here. The panel follows the finger; far or fast enough switches the tab,
   anything less springs back. Left alone: the screen edges (the system's back gesture), the reorder grip,
   a text selection, and a second finger. The tap that ends a swipe is swallowed so it can't play a row,
   seek to a lyric line or open a link. */
const mainEl = document.querySelector('main');
let swipe = null, noClickUntil = 0;
function springBack(p) {
  p.style.transition = 'transform .2s ease, opacity .2s ease';
  p.style.transform = p.style.opacity = '';
  setTimeout(() => { p.style.transition = ''; }, 220);
}
mainEl.addEventListener('pointerdown', (e) => {
  if (swipe) {   // another finger, or a swipe whose end was missed
    if (swipe.lock === 'x') springBack(swipe.panel);
    swipe = null;
  }
  if (e.pointerType !== 'touch' || !e.isPrimary || drag) return;
  if (e.clientX < 20 || e.clientX > innerWidth - 20 || e.target.closest('.grip')) return;
  swipe = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, v: 0, pt: e.timeStamp, lock: '', panel: panelOf(state.tab) };
});
mainEl.addEventListener('pointermove', (e) => {
  const s = swipe;
  if (!s || e.pointerId !== s.id) return;
  if (!s.lock) {
    const dx = e.clientX - s.x, dy = e.clientY - s.y;
    if (Math.hypot(dx, dy) < 10) return;
    const sel = getSelection();
    if (Math.abs(dx) < Math.abs(dy) * 1.4 || drag || (sel && !sel.isCollapsed)) { swipe = null; return; }   // a scroll, or text being selected
    s.lock = 'x';
    s.x += Math.sign(dx) * 10;   // follow from here on, without a jump
  }
  const d = e.clientX - s.x, i = TABS.indexOf(state.tab);
  const end = (d > 0 && i === 0) || (d < 0 && i === TABS.length - 1);
  s.v = 0.6 * s.v + 0.4 * (d - s.dx) / Math.max(1, e.timeStamp - s.pt);
  s.dx = d;
  s.pt = e.timeStamp;
  const shown = end ? d / 4 : d;   // no tab that way: the panel gives only a little
  s.panel.style.transform = `translateX(${shown}px)`;
  s.panel.style.opacity = String(1 - 0.35 * Math.min(1, Math.abs(shown) / mainEl.clientWidth));
});
function endSwipe(e) {
  const s = swipe;

  if (s.lock !== 'x') return;
  noClickUntil = e.timeStamp + 400;
  const j = TABS.indexOf(state.tab) + (s.dx < 0 ? 1 : -1);
  const far = Math.abs(s.dx) > Math.min(100, mainEl.clientWidth * 0.25);
  const flick = Math.abs(s.dx) > 40 && Math.abs(s.v) > 0.4 && Math.sign(s.v) === Math.sign(s.dx);
  if (e.type === 'pointerup' && j >= 0 && j < TABS.length && (far || flick)) {
    s.panel.style.transition = s.panel.style.transform = s.panel.style.opacity = '';
    setTab(TABS[j], s.dx < 0 ? 1 : -1);
  } else springBack(s.panel);
}
mainEl.addEventListener('pointerup', endSwipe);
mainEl.addEventListener('pointercancel', endSwipe);
mainEl.addEventListener('click', (e) => { if (e.timeStamp < noClickUntil) { e.preventDefault(); e.stopPropagation(); } }, true);

async function repoAction(a) {
  if (a === 'connect') {
    const name = String(repoDraft.name != null ? repoDraft.name : repo.cfg.name).trim()
      .replace(/^(https?:\/\/)?github\.com\//i, '').replace(/\.git$/i, '').replace(/\/+$/, '');
    const token = String(repoDraft.token || '').trim() || repo.cfg.token;
    if (!/^[\w.-]+\/[\w.-]+$/.test(name)) { setRepoStatus('err', '저장소는 owner/repo 형식으로 적어 주세요'); return; }
    if (!token) { setRepoStatus('err', '토큰을 넣어 주세요'); return; }
    setRepoStatus('busy');
    let info;
    try { info = await gh(rp(name), token); } catch (e) { setRepoStatus('err', e.message); return; }
    if (name !== repo.cfg.name) {   // another repository: drop what was kept from the old one
      repo.tree = repo.idx = repo.ko = null;
      await kv.clear();
      textCache = new WeakMap();
      repoSrcs.clear();
    }
    repo.cfg = { name, token, branch: info.default_branch || 'main', on: true };
    saveRepoCfg();
    repoDraft = {};
    await repoSync(true);
    repoRematch();
    repoPrefetch();
    refreshSheet();
    if (repo.status === 'ok') toast(`자막 저장소에 연결했어요 · 자막 폴더 ${repo.idx ? repo.idx.works.size : 0}개`);
  } else if (a === 'refresh') {
    await repoSync(true);
    repoRematch();
    repoPrefetch();
    refreshSheet();
  } else if (a === 'toggle') {
    repo.cfg.on = !repo.cfg.on;
    saveRepoCfg();
    lyricVer++;
    renderQueue();
    loadLyrics();
    refreshSheet();
    if (repo.cfg.on) repoAfterAdd();
  } else if (a === 'forget') {
    if (!confirm('연결을 끊고 이 기기에 받아 둔 자막을 지울까요? 다시 연결하려면 토큰을 새로 넣어야 해요.')) return;
    repo.cfg = { name: repo.cfg.name, token: '', branch: '', on: true };
    saveRepoCfg();
    repo.tree = repo.idx = repo.ko = null;
    repo.checkedAt = 0;
    await kv.clear();
    textCache = new WeakMap();
    repoSrcs.clear();
    setRepoStatus('idle');
    repoRematch();
    refreshSheet();
    toast('자막 저장소 연결을 끊었어요');
  }
}

els.sheetBody.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const [act, val] = b.dataset.act.split(':');
  if (act === 'nav') { switchSheet(...settingsPage(val)); return; }
  if (act === 'repo') { repoAction(val); return; }
  if (act === 'app') { saveSession(true); location.reload(); return; }
  if (act === 'pick') {
    const c = cur(), a = c && c.repo && c.repo.alts[+val];
    if (!a) return;
    repo.picks[c.repo.group] = a.dir;
    store.set('repoPick', repo.picks);
    repoRematch();
    repoPrefetch();
    refreshSheet();
    return;
  }
  if (act === 'mode') { setMode(val); closeSheet(); return; }
  if (act === 'rate') { setRate(+val); closeSheet(); return; }
  if (act === 'sleep') { setSleep(val === 'off' || val === 'end' ? val : +val); closeSheet(); return; }
  if (act === 'off') {
    const c = cur();
    if (!c) return;
    const k = offKey(c);
    const nv = val === 'reset' ? 0 : Math.round((offsetOf(c) + +val) * 10) / 10;
    if (nv === 0) delete state.offsets[k]; else state.offsets[k] = clamp(nv, -30, 30);
    store.set('offsets', state.offsets);
    tickLyrics(true);
  } else if (act === 'fs') {
    state.fontSize = clamp(state.fontSize + +val, 14, 34);
    store.set('fontSize', state.fontSize);
    applyLyricStyle();
    tickLyrics(true);
  } else if (act === 'al') {
    state.align = val;
    store.set('align', val);
    applyLyricStyle();
    tickLyrics(true);
  } else if (act === 'ff') {
    state.fontFam = val;
    store.set('fontFam', val);
    applyLyricStyle();
    tickLyrics(true);
  } else if (act === 'auto') {
    state.autoReturn = !state.autoReturn;
    store.set('autoReturn', state.autoReturn);
  } else if (act === 'wake') {
    state.keepAwake = !state.keepAwake;
    store.set('keepAwake', state.keepAwake);
    syncWake();
  } else if (act === 'ja') {
    state.jaMode = val;
    store.set('jaMode', val);
    loadLyrics();
  } else if (act === 'theme') {
    state.theme = val;
    store.set('theme', val);
    applyTheme();
  } else if (act === 'sub') {
    state.subDirs = !state.subDirs;
    store.set('subDirs', state.subDirs);
    renderSubNote();
  } else if (act === 'skip') {
    state.skip = +val;
    store.set('skip', state.skip);
    renderSkip();
  } else if (act === 'names') {
    state.names = val;
    store.set('names', val);
    renderQueue();
  }
  refreshSheet();
});
els.sheetBody.addEventListener('input', (e) => {
  if (e.target.id === 'repoName') repoDraft.name = e.target.value;
  else if (e.target.id === 'repoToken') repoDraft.token = e.target.value;
});
els.sheetBody.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.closest('.field')) { e.preventDefault(); e.target.blur(); repoAction('connect'); }
});

els.bMode.addEventListener('click', () => openSheet('재생 모드', modeSheet));
els.bRate.addEventListener('click', () => openSheet('재생 속도', rateSheet));
els.bSleep.addEventListener('click', () => {
  const left = state.sleepAt ? `<small>${fmt(Math.ceil((state.sleepAt - Date.now()) / 1000))} 뒤에 멈춰요</small>` : state.sleepEnd ? '<small>지금 곡이 끝나면 멈춰요</small>' : '';
  openSheet('수면 타이머' + left, sleepSheet);
});
/* ---------- settings (the logo) ----------
   Two tabs at the bottom like the app's own: 일반, and 가사 with 자막 저장소 one page in.
   Opened from the lyrics tab it starts on 가사. */
const dayText = (s) => {
  const d = new Date(s);
  return isNaN(d) ? '' : `${d.getMonth() + 1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
};
const segBtns = (act, opts, cur) => opts.map(([k, label]) =>
  `<button type="button" data-act="${act}:${k}" class="${cur === k ? 'on' : ''}" aria-pressed="${cur === k}">${label}</button>`).join('');
const genSheet = () => {
  const mine = dayText(document.lastModified);
  const hint = [mine ? `지금 쓰는 판: ${mine}` : '',
    state.queue.length ? '새로 고치면 재생목록이 비어요. 같은 폴더를 다시 추가하면 순서와 듣던 위치를 이어서 불러와요.' : ''].filter(Boolean).join(' · ');
  return `<div class="set">
      <div class="set-h"><b>화면 테마</b><small>시스템은 휴대폰의 화면 모드를 따라가요</small></div>
      <div class="seg" role="group" aria-label="화면 테마">${segBtns('theme', Object.entries(THEMES), state.theme)}</div>
    </div>
    <div class="set">
      <div class="set-h"><b>곡·작품 이름</b><small>재생목록·앨범·잠금 화면의 이름이에요. 기본은 파일·폴더 이름 그대로, 한/일은 한국어를 크게 일본어를 작게 보여줘요. 한국어·일본어 이름은 자막 저장소의 트랙명.md에서 가져오고, 없으면 기본 이름을 써요</small></div>
      <div class="seg" role="group" aria-label="곡·작품 이름">${segBtns('names', Object.entries(NAME_MODES), state.names)}</div>
    </div>
    <div class="sw-row">
      <div class="set-h"><b>하위 폴더도 추가</b><small>폴더를 추가하면 그 안의 폴더에 든 곡도 넣어요. mp3·wav처럼 같은 곡이 든 폴더가 함께 있으면 두 번 들어갈 수 있어요</small></div>
      <button class="switch" type="button" role="switch" aria-checked="${state.subDirs}" aria-label="하위 폴더도 추가" data-act="sub"></button>
    </div>
    <div class="set">
      <div class="set-h"><b>건너뛰기 간격</b><small>재생 칸의 뒤로·앞으로 버튼이 움직이는 만큼이에요</small></div>
      <div class="seg" role="group" aria-label="건너뛰기 간격">${segBtns('skip', SKIPS.map((n) => [n, n + '초']), state.skip)}</div>
    </div>
    <div class="set">
      <button class="btn wide" type="button" data-act="app:reload"><svg><use href="#i-refresh"/></svg>새로 고침</button>
      ${hint ? `<p class="hint">${hint}</p>` : ''}
    </div>`;
};
const SETTINGS = { gen: ['설정', genSheet], lyr: ['설정', lyrSheet], repo: ['자막 저장소', repoSheet] };
// marks the tab the page belongs to and gives the page's [title, render] for openSheet / switchSheet
function settingsPage(p) {
  if (p === 'repo') repoDraft = {};
  els.setGen.setAttribute('aria-selected', String(p === 'gen'));
  els.setLyr.setAttribute('aria-selected', String(p !== 'gen'));
  return SETTINGS[p];
}
els.appMenu.addEventListener('click', () => openSheet(...settingsPage(state.tab === 'lyrics' ? 'lyr' : 'gen'), true));
els.setGen.addEventListener('click', () => switchSheet(...settingsPage('gen')));
els.setLyr.addEventListener('click', () => switchSheet(...settingsPage('lyr')));

function applyTheme() {
  if (state.theme === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = state.theme;
}
function renderSubNote() { els.qSubNote.textContent = state.subDirs ? '하위 폴더도 함께 넣어요' : '하위 폴더는 넣지 않아요'; }

/* ---------- toast ---------- */
let toastTimer = 0, toastFn = null;
// the shown panel's button rows are at its bottom; the toast goes just above them
function placeToast() {
  const p = state.tab === 'queue' ? els.panelQueue : state.tab === 'lyrics' ? els.panelLyrics : null;
  let h = 0;
  if (p) for (const b of p.children) if (b.classList.contains('bar') && !b.hidden) h += b.offsetHeight;
  els.toast.style.bottom = h + 12 + 'px';
}
function toast(msg, actLabel, fn) {
  placeToast();
  els.toastMsg.textContent = msg;
  toastFn = fn || null;
  els.toastAct.hidden = !fn;
  if (fn) els.toastAct.textContent = actLabel;
  els.toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { els.toast.hidden = true; toastFn = null; }, fn ? 5000 : 2800);
}
els.toastAct.addEventListener('click', () => {
  const f = toastFn;
  els.toast.hidden = true;
  toastFn = null;
  clearTimeout(toastTimer);
  if (f) f();
});

/* ---------- resume where you left off ---------- */
let lastSave = 0;
function saveSession(force) {
  const now = Date.now();
  if (!force && now - lastSave < 5000) return;
  lastSave = now;
  const real = state.queue;
  if (!real.length) return;                      // keep the last list for next time
  const c = cur();
  const ci = c ? real.indexOf(c) : -1;
  saved = {
    items: real.map((x) => ({ k: x.key, nk: x.nkey })),
    cur: ci,
    t: ci >= 0 ? Math.floor(pendingSeek || audio.currentTime || 0) : 0,   // resume point not applied yet (iOS loads metadata only on play)
    name: ci >= 0 ? c.name : '',
    at: now,
  };
  store.set('session', saved);
}
window.addEventListener('pagehide', () => saveSession(true));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveSession(true);
  else { kick(); tickLyrics(true); renderSleep(); }
  syncWake();
});
window.addEventListener('resize', () => { sizeSpacers(); placeFrame(els.lFrame.classList.contains('gap')); if (follow) scrollToActive(true); });

/* ---------- keyboard (for iPad / desktop) ---------- */
document.addEventListener('keydown', (e) => {
  if (!els.sheetWrap.hidden) { if (e.key === 'Escape') closeSheet(); return; }
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'LABEL' && (e.key === 'Enter' || e.key === ' ')) {   // the file-add labels stand in for hidden inputs
    const inp = $(e.target.htmlFor);
    if (inp) { e.preventDefault(); inp.click(); }
    return;
  }
  if (e.altKey || e.ctrlKey || e.metaKey) return;                   // leave browser shortcuts like Alt+← alone
  if (/INPUT|TEXTAREA|SELECT/.test(tag) || e.target === els.seek) return;
  if (e.key === ' ' && tag !== 'BUTTON') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowLeft') skipBy(-state.skip);
  else if (e.key === 'ArrowRight') skipBy(state.skip);
  else if (e.key === '1' || e.key === '2' || e.key === '3') tabTo(TABS[+e.key - 1]);
});

/* ---------- start ---------- */
repo.loading = repo.cfg.token ? repoLoadCached() : Promise.resolve();
applyTheme();
applyLyricStyle();
renderMode();
renderRate();
renderSleep();
renderSkip();
renderSubNote();
artUrl = makeArtwork();
renderQueue();
loadLyrics();
setTab(state.tab);
renderLyrBar();
})();
</script>

</body>
</html>
