<title><mark></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style id="css">
/* Layout: one-screen app, every control at the bottom where the thumb is (like Safari's address bar):
   the panel scrolls, under it the panel's own buttons, then the transport dock, then the logo and the tabs.
   The single bold element is the current-lyric box; everything else stays quiet. */
:root{
  --bg:#F1F2F6; --raise:#FFFFFF; --sunk:#E4E6EE; --line:#D6D9E3;
  --fg:#151925; --muted:#5E6579; --faint:#9CA1B2;
  --accent:#2C55D8; --on-accent:#FFFFFF; --accent-soft:rgba(44,85,216,.10); --accent-line:rgba(44,85,216,.5);
  --danger:#BF3A2F; --inv-accent:#A8BBFF; --knob:#FFFFFF; --scrim:rgba(12,14,20,.45);
  --shadow:0 12px 32px rgba(21,25,37,.18);
  --font-ui:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Noto Sans KR",system-ui,sans-serif;
  --font-lyric:"Gowun Batang","AppleMyungjo","Nanum Myeongjo",Batang,serif;
  --font-code:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --brand:#FAC775; --brand-ink:#1A2240;   /* logo only; same in both themes */
  --lyric-size:20px;
  --top-gap:36px;   /* room under the status bar: iOS (home-screen app, iOS 26+) lays a soft fade over it */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1118; --raise:#1A1D27; --sunk:#20242F; --line:#2B303D;
    --fg:#E8EBF3; --muted:#959CB0; --faint:#5F6679;
    --accent:#88A3FF; --on-accent:#0D1017; --accent-soft:rgba(136,163,255,.13); --accent-line:rgba(136,163,255,.55);
    --danger:#FF857A; --inv-accent:#2C55D8; --knob:#FFFFFF; --scrim:rgba(0,0,0,.55);
    --shadow:0 12px 32px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1118; --raise:#1A1D27; --sunk:#20242F; --line:#2B303D;
  --fg:#E8EBF3; --muted:#959CB0; --faint:#5F6679;
  --accent:#88A3FF; --on-accent:#0D1017; --accent-soft:rgba(136,163,255,.13); --accent-line:rgba(136,163,255,.55);
  --danger:#FF857A; --inv-accent:#2C55D8; --knob:#FFFFFF; --scrim:rgba(0,0,0,.55);
  --shadow:0 12px 32px rgba(0,0,0,.55);
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
html,body{overscroll-behavior-x:none}   /* no sideways overscroll: Chrome's swipe back/forward would leave the page and drop the queue */
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
label.btn{cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}

/* app bar: the logo (app menu) and the tabs, at the very bottom */
.appbar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px 8px;background:var(--bg)}
/* wordmark: brand highlighter yellow, used nowhere else, so the logo never looks like a selection or the lyric box */
.logo{position:relative;flex:none;height:40px;margin-left:-4px;padding:0 4px;border-radius:10px;display:flex;align-items:center;font-family:var(--font-code);font-size:16px;font-weight:700;letter-spacing:-.02em}
.logo:active{background:var(--sunk)}
.logo i{font-style:normal;font-weight:600;color:var(--muted)}
.logo b{position:relative;isolation:isolate;margin:0 4px;padding:0 3px;color:var(--brand-ink);line-height:1.55}
.logo b::before{content:"";position:absolute;inset:1px -3px 0;z-index:-1;background:var(--brand);border-radius:2px 6px 3px 7px;transform:skewX(-12deg) rotate(-3deg)}
.tabs{flex:1;min-width:0;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:3px;padding:3px;border-radius:12px;background:var(--sunk)}
.tab{height:38px;min-width:0;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;font-size:14px;font-weight:600;color:var(--muted)}
.tab svg{width:17px;height:17px;flex:none}
@media (max-width:380px){.tab svg{display:none}}
.tab[aria-selected="true"]{background:var(--raise);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tab .n{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}

main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
/* the browser only scrolls the panels up and down; a sideways drag is left to the tab swipe */
.panel,.scroll,#lEmpty{touch-action:pan-y pinch-zoom}
@keyframes in-next{from{transform:translateX(36px);opacity:0}}
@keyframes in-prev{from{transform:translateX(-36px);opacity:0}}
.panel.in-next{animation:in-next .2s ease-out}
.panel.in-prev{animation:in-prev .2s ease-out}
.bar{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 16px}
.spacer{flex:1}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

.btn{height:34px;padding:0 12px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13.5px;font-weight:600;background:var(--raise);border:1px solid var(--line);color:var(--fg)}
.btn svg{width:17px;height:17px;flex:none}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding:0 8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.4}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.wide{width:100%;height:44px;justify-content:center}
.selcount{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}

/* queue */
.note{margin:2px 16px 8px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:13px;line-height:1.5;color:var(--muted)}
.note b{color:var(--fg);font-weight:600}
#queue{list-style:none;margin:0;padding:0 0 16px;position:relative}
.row{position:relative;display:flex;align-items:center;min-height:58px;background:var(--bg);border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row:first-child{border-top:1px solid var(--line)}
.row.cur{background:var(--accent-soft)}
.grip{width:44px;align-self:stretch;flex:none;display:flex;align-items:center;justify-content:center;color:var(--faint);touch-action:none;cursor:grab}
.grip svg{width:18px;height:18px}
.title-btn{flex:1;min-width:0;padding:9px 0;text-align:left;display:flex;flex-direction:column;gap:4px}
.t{font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row.cur .t{color:var(--accent);font-weight:700}
/* the name in the other language (settings › 곡·작품 이름 › 한/일, 일/한): small and quiet under the first */
.t2{margin-top:-2px;font-size:12.5px;line-height:1.3;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;gap:5px;min-width:0;font-size:11.5px;color:var(--muted)}
.chip{flex:none;padding:0 5px;border:1px solid var(--line);border-radius:4px;font-size:10.5px;font-weight:700;letter-spacing:.04em;line-height:16px;color:var(--muted)}
.chip.ly{border-color:var(--accent-line);color:var(--accent)}
.chip.warn{border-color:var(--danger);color:var(--danger)}
.dir{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm{width:46px;align-self:stretch;flex:none;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.rm svg{width:18px;height:18px}
.row.bad .t{color:var(--faint);text-decoration:line-through}
.eq{display:none;align-items:flex-end;gap:2px;height:10px;flex:none;margin-right:2px}
body.playing .row.cur .eq{display:inline-flex}
.eq i{display:block;width:2.5px;height:35%;border-radius:1px;background:var(--accent)}
body.playing .eq i{animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s!important}.eq i:nth-child(3){animation-delay:-.55s!important}
@keyframes eq{from{height:25%}to{height:100%}}
.row.dragging{z-index:5;background:var(--raise);border-radius:10px;border-color:transparent;box-shadow:var(--shadow)}
.row.dragging .grip{cursor:grabbing;color:var(--accent)}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--faint);display:flex;align-items:center;justify-content:center;color:var(--on-accent)}
.check svg{width:13px;height:13px;opacity:0}
.row.sel .check{background:var(--accent);border-color:var(--accent)}
.row.sel .check svg{opacity:1}
.row.sel{background:var(--accent-soft)}

.empty{padding:28px 20px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;max-width:460px;color:var(--muted)}
.empty h3{margin:0;font-size:17px;color:var(--fg);text-wrap:balance}
.empty p{margin:0;line-height:1.55}
.empty .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.fine{font-size:12.5px}
#lEmpty{flex:1;min-height:0;max-width:none;overflow-y:auto}
/* empty queue: one centred block — a badge, a line of help, the last list if any, two big buttons */
#qScroll{display:flex;flex-direction:column}
#queue{flex:none}
#qEmpty{flex:1;width:100%;max-width:420px;margin:0 auto;align-items:center;justify-content:center;gap:12px;padding:8px 20px 32px;text-align:center;text-wrap:balance;word-break:keep-all}
#qEmpty .badge{width:64px;height:64px;margin-bottom:2px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
#qEmpty .badge svg{width:30px;height:30px}
#qEmpty h3{font-size:19px}
#qEmpty p{max-width:310px}
#qEmpty .note{width:100%;margin:2px 0 0;text-align:left}
#qEmpty .fine{color:var(--faint);line-height:1.6}
/* the last-list card, or a short screen: drop the badge so the block still fits */
#qEmpty:has(#qNote:not([hidden])) .badge{display:none}
@media (max-height:720px){#qEmpty .badge{display:none}.bigadd label{height:88px}}
.bigadd{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.bigadd label{height:108px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--raise);color:var(--fg);font-size:16px;font-weight:700;cursor:pointer;-webkit-user-select:none;user-select:none;box-shadow:0 1px 2px rgba(21,25,37,.06)}
.bigadd label svg{width:32px;height:32px}
.bigadd label.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.bigadd label:active{filter:brightness(.94)}
/* files dragged over the page */
body.dropping #app::after{content:"";position:fixed;inset:8px;z-index:60;border:3px dashed var(--accent);border-radius:20px;background:var(--accent-soft);pointer-events:none}
/* content starts below the status-bar fade and fades out as it scrolls up into it */
.fade-top{-webkit-mask-image:linear-gradient(transparent,#000 var(--top-gap));mask-image:linear-gradient(transparent,#000 var(--top-gap))}
.gap-top{padding-top:var(--top-gap)}

/* lyrics */
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:9px;background:var(--sunk)}
.seg button{height:28px;padding:0 12px;border-radius:7px;font-size:12.5px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
.seg button.on{background:var(--raise);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.35}
.lyrics{position:relative;padding-inline:16px}
.lnote{margin:0 4px 8px;font-size:12.5px;color:var(--muted)}
#lyrics{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.ln{display:flex;flex-direction:column;gap:.15em;padding:.38em .7em;border:2px solid transparent;border-radius:12px;font-family:var(--font-lyric);font-size:var(--lyric-size);line-height:1.45;color:var(--muted);cursor:pointer;word-break:keep-all;overflow-wrap:anywhere;transition:color .3s}
.sans .ln{font-family:var(--font-ui)}
.ln .sub{font-size:.72em;opacity:.9}
.ln .rest{letter-spacing:.2em}
.ln.on{color:var(--fg)}
.ln.on .sub{color:var(--muted)}
.ln.on.gap{color:var(--muted)}
.lyrics.free .ln.on{color:var(--accent)}
/* fixed box in the middle of the lyrics view; lines scroll through it */
.lwrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.lwrap .lyrics{position:relative;z-index:1}
.lframe{position:absolute;z-index:0;left:16px;right:16px;top:50%;height:60px;transform:translateY(-50%);border:2px solid var(--accent);border-radius:12px;background:var(--accent-soft);pointer-events:none;opacity:0;transition:height .3s ease,opacity .25s,border-color .25s,background-color .25s}
.lframe.show{opacity:1}
.lframe.gap{border-style:dashed;border-color:var(--accent-line);background:transparent}
.untimed .ln{cursor:default;color:var(--fg)}
.lyrics.center .ln{align-items:center;text-align:center}
.lyrics.center .lnote{text-align:center}
.follow{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:4;height:38px;padding:0 16px 0 12px;border-radius:19px;display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:var(--on-accent);font-size:13.5px;font-weight:700;box-shadow:var(--shadow);white-space:nowrap}
.follow svg{width:17px;height:17px}
main:has(.toast:not([hidden])) .follow{bottom:72px}

/* album: the work's cover, its title in full, the song quietly under it, then the ways out */
.album{width:100%;max-width:440px;margin:0 auto;padding:10px 16px 24px;display:flex;flex-direction:column;gap:16px}
.cover{position:relative;width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--sunk)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;-webkit-touch-callout:none}
.cover .ph{display:none;position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;color:var(--faint)}
.cover.none .ph{display:block}
.cover.has{box-shadow:0 10px 26px rgba(21,25,37,.22)}
.a-info{display:flex;flex-direction:column;gap:16px}
.a-title{margin:0;font-size:21px;font-weight:700;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.a-song{margin:6px 0 0;display:flex;align-items:flex-start;gap:6px;font-size:13.5px;color:var(--muted)}
.a-song .eq{margin-top:4px}   /* level with the first line when a second name sits under it */
.a-song span:last-child{min-width:0;overflow-wrap:anywhere}
.a-alt{margin:6px 0 0;font-size:14.5px;line-height:1.4;color:var(--muted);word-break:keep-all;overflow-wrap:anywhere}
.a-title:lang(ja),.a-alt:lang(ja){word-break:normal}
.a-song small{display:block;margin-top:2px;font-size:12.5px;opacity:.8}
body.playing .a-song .eq{display:inline-flex}
.a-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.a-chips .chip{padding:0 9px;border-radius:7px;font-size:13.5px;line-height:26px}   /* bigger than the queue rows' chips */
.a-code{white-space:nowrap;-webkit-user-select:all;user-select:all}   /* one long-press picks the whole code to copy */
.a-links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.a-links.one{grid-template-columns:1fr}
.a-links .btn{height:42px;min-width:0;justify-content:center;text-decoration:none}
.a-links .btn span{overflow:hidden;text-overflow:ellipsis}
.a-links .btn .ext{width:13px;height:13px;color:var(--faint)}

/* toast: above the panel's buttons (its bottom is set when shown) */
.toast{position:absolute;left:16px;right:16px;bottom:12px;z-index:10;max-width:440px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:11px 12px 11px 14px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:13.5px;box-shadow:var(--shadow)}
.toast span{flex:1;min-width:0}
.toast button{flex:none;font-weight:700;color:var(--inv-accent)}

/* dock */
.dock{flex:none;display:flex;flex-direction:column;gap:4px;padding:10px 16px 8px;border-top:1px solid var(--line);background:var(--bg)}
.now{min-width:0}
.now-t{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-s{min-height:17px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
/* touch area is 48px tall and reaches into the side gutters; the negative margins keep the dock the same height */
.seek{position:relative;z-index:1;height:48px;margin:-11px -16px;padding-inline:16px;display:flex;align-items:center;cursor:pointer;touch-action:none;border-radius:6px}
.track{position:relative;flex:1;height:6px;border-radius:3px;background:var(--sunk);transition:height .15s}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:var(--accent)}
.thumb{position:absolute;top:50%;left:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--bg);transition:transform .15s}
.seek.active .track{height:8px}
.seek.active .thumb{transform:scale(1.25)}
.times{display:flex;justify-content:space-between;margin-top:-3px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.transport{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.tb{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.tb svg{width:26px;height:26px}
.tb.skip svg{width:30px;height:30px}
.tb.play{width:62px;height:62px;background:var(--accent);color:var(--on-accent)}
.tb.play svg{width:28px;height:28px}
.tb:active{background:var(--sunk)}
.tb.play:active{background:var(--accent);filter:brightness(.9)}
.extras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:2px}
.xb{height:34px;min-width:0;padding:0 6px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--sunk);color:var(--muted);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.xb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xb svg{width:17px;height:17px;flex:none}
.xb.on{background:var(--accent-soft);color:var(--accent)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet{width:100%;max-width:560px;max-height:82%;display:flex;flex-direction:column;padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;background:var(--raise);box-shadow:var(--shadow)}
.sheet-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 10px}
.sheet-body{flex:1 1 auto;min-height:0;margin:0 -16px;padding:0 16px;overflow-y:auto;overscroll-behavior:contain}
/* the settings: one height whichever tab is shown, its tabs at the bottom where the app's own are */
.sheet.tabbed{height:min(82%,680px);padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.sheet-tabs{flex:none;margin-top:10px;grid-template-columns:1fr 1fr}
.sheet-head h2{margin:0;font-size:16px}
.sheet-head small{display:block;margin-top:2px;font-size:12.5px;font-weight:400;color:var(--muted)}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--sunk);color:var(--muted);flex:none}
.icon-btn svg{width:18px;height:18px}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 10px;border-radius:12px;text-align:left}
.opt>svg{width:22px;height:22px;flex:none;color:var(--muted)}
.opt>span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.opt b{font-weight:650}
.opt small{font-size:12.5px;color:var(--muted)}
.opt.sel{background:var(--accent-soft)}
.opt.sel>svg{color:var(--accent)}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.chips.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.chipbtn{height:46px;border-radius:10px;background:var(--sunk);font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}
.chipbtn.sel{background:var(--accent);color:var(--on-accent)}
.chipbtn.full{grid-column:1/-1}
.set{display:flex;flex-direction:column;gap:9px;padding:14px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0;padding-top:4px}
.set-h{display:flex;flex-direction:column;gap:2px}
.set-h b{font-weight:650}
.set-h small,.hint{font-size:12.5px;color:var(--muted);margin:0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper output{flex:1;min-width:0;text-align:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.stepper .btn{padding:0 10px;font-variant-numeric:tabular-nums}
.sw-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
/* a setting whose control fits beside its name (the lyric settings): the name left, the control right;
   a narrow screen puts the control on its own line, still at the right. A hint takes the whole line under them. */
.set.inline{flex-direction:row;flex-wrap:wrap;align-items:center;column-gap:12px}
.set.inline>.set-h{flex:1 0 auto}
.set.inline>.stepper,.set.inline>.seg{margin-left:auto}
.set.inline>.hint{flex-basis:100%}
.set.inline .stepper output{flex:none;min-width:50px}
.set.inline .stepper .btn{padding:0 8px}
.sw-row .set-h{flex:1;min-width:0}
.switch{position:relative;flex:none;width:50px;height:30px;border-radius:15px;background:var(--line);transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
/* subtitle repository sheet */
.back{display:inline-flex;align-items:center;gap:2px;height:32px;margin:-6px 0 6px -6px;padding:0 6px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--accent)}
.back svg{width:18px;height:18px}
.stat{margin:0 0 4px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:13px;line-height:1.55;color:var(--muted);overflow-wrap:anywhere}
.stat b{color:var(--fg);font-weight:600}
.stat.err,.stat.err b{color:var(--danger)}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.field input{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px;font-weight:400}
.field input::placeholder{color:var(--faint)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.opt.nav{min-height:52px;margin:0 -10px}
.opt .chev{width:18px;height:18px;flex:none;color:var(--faint)}
.opt b{overflow-wrap:anywhere}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>

/* ---------- lyric parsing ---------- */
function parseLRC(text) {

function parseSRT(text) {
  const blocks = text.replace(/\r\n?/g, '\n').split(/\n[ \t]*\n/);

const offKey = (it) => it.nkey;
const offsetOf = (it) => (it && +state.offsets[offKey(it)]) || 0;

/* ---------- items & lyrics lookup ---------- */
function makeItem(file, path) {
  const p = splitName(path);
  return { id: uid(), file, path, name: p.base, base: p.base, ext: p.ext, dir: p.dir, key: path + '|' + file.size, nkey: p.name + '|' + file.size, bad: false };
}

function registerLyric(file, p) {
  const kind = p.ext === 'lrc' ? 'lrc' : 'srt';
  const k = p.base.toLowerCase();
  let e = lyricIndex.get(k);
  if (!e) { e = { lrc: [], srt: [] }; lyricIndex.set(k, e); }
  e[kind] = e[kind].filter((x) => x.dir !== p.dir);
  e[kind].push({ dir: p.dir, file });
  lyricVer++;
}

// every queue render asks this for every row, and the prefix scan below walks the whole index
function findLyrics(it) {
  if (it.lyrMemo && it.lyrMemo.v === lyricVer) return it.lyrMemo.r;
  const b = it.base.toLowerCase();
  const pick = (arr) => (arr && arr.length ? (arr.find((x) => x.dir === it.dir) || arr[0]).file : null);
  const e = lyricIndex.get(b);
  let lrc = pick(e && e.lrc), srt = pick(e && e.srt), ja = null;
  // song.ko.srt, song.en.lrc …: Korean first; song.ja.* is kept for the Japanese line under it
  const more = [];
  for (const [k, v] of lyricIndex) {
    if (!k.startsWith(b + '.')) continue;
    const tag = k.slice(b.length + 1);
    if (JA_TAG.test(tag)) ja = ja || pick(v.srt) || pick(v.lrc);
    else more.push([KO_TAG.test(tag) ? 0 : 1, v]);
  }
  more.sort((x, y) => x[0] - y[0]);
  for (const [, v] of more) { if (!lrc) lrc = pick(v.lrc); if (!srt) srt = pick(v.srt); }
  const r = it.repo && repo.cfg.on ? it.repo : null;   // the repository's files win over the ones next to the song
  if (r) { lrc = repoSrc(r.lrc) || lrc; srt = repoSrc(r.srt) || srt; ja = repoSrc(r.ja) || ja; }
  if (!lrc && !srt && ja) { srt = ja; ja = null; }       // Japanese is all there is
  it.lyrMemo = { v: lyricVer, r: { lrc, srt, ja, repo: !!r } };
  return it.lyrMemo.r;
}

function getText(src) {
  let p = textCache.get(src);
  if (!p) {
    p = src.repoSha ? repoText(src.repoSha) : readText(src);
    p.catch(() => { if (textCache.get(src) === p) textCache.delete(src); });   // try again next time
    textCache.set(src, p);
  }
  return p;
}

/* ---------- subtitle repository ----------
   Subtitles kept in a private GitHub repository (subtitles/<RJ code_title>/<track>.lrc · .ko.srt · .ja.srt),
   read with a read-only token entered once in the settings. The file list comes from one tree request and is kept;
   a matched song's files are fetched right after the song is added and kept by blob sha, so they also work offline. */
const repo = {
  cfg: Object.assign({ name: '', token: '', branch: '', on: true }, store.get('repo', null) || {}),
  picks: store.get('repoPick', {}) || {},   // RJ code (or local folder) -> repository folder, when several fit
  tree: null, idx: null, ko: null, checkedAt: 0,
  status: 'idle', msg: '', dl: null,
  loading: null, syncing: null, fetching: Promise.resolve(),
};
let repoDraft = {};             // what is typed in the settings, until it is connected
const repoSrcs = new Map();     // blob sha -> the one source object getText caches by
const blobJobs = new Map();
const saveRepoCfg = () => store.set('repo', repo.cfg);
const repoReady = () => !!(repo.cfg.on && repo.cfg.token && repo.cfg.name);

// IndexedDB key-value store; memory only if it is unavailable
function idbKV(name) {
  const mem = new Map();
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open(name, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const run = (mode, fn) => open().then((db) => new Promise((res, rej) => {
    const t = db.transaction('kv', mode), q = fn(t.objectStore('kv'));
    t.oncomplete = () => res(q.result);
    t.onerror = t.onabort = () => rej(t.error);
  }));
  return {
    async get(k) {
      if (mem.has(k)) return mem.get(k);
      try { const v = await run('readonly', (s) => s.get(k)); if (v !== undefined) mem.set(k, v); return v; } catch (e) { return undefined; }
    },
    async set(k, v) { mem.set(k, v); try { await run('readwrite', (s) => s.put(v, k)); } catch (e) { /* memory only */ } },
    async clear() { mem.clear(); try { await run('readwrite', (s) => s.clear()); } catch (e) { /* ignore */ } },
  };
}
// the subtitle file list ('tree') and fetched files ('b:<sha>')
const kv = idbKV('mark-subs');

const rp = (name = repo.cfg.name) => '/repos/' + name.split('/').map(encodeURIComponent).join('/');
const urlPath = (s) => s.split('/').map(encodeURIComponent).join('/');
const repoFolderUrl = (dir) => `https://github.com/${urlPath(repo.cfg.name)}/tree/${urlPath(repo.cfg.branch || 'HEAD')}/${urlPath(dir)}`;
async function gh(path, token) {
  let r;
  try {
    r = await fetch('https://api.github.com' + path, { headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + token }, cache: 'no-store' });
  } catch (e) { throw new Error('GitHub에 연결하지 못했어요. 인터넷 연결을 확인하세요'); }
  if (r.ok) return r.json();
  const s = r.status, limited = s === 429 || (s === 403 && r.headers.get('x-ratelimit-remaining') === '0');
  throw new Error(s === 401 ? '토큰이 맞지 않거나 만료됐어요'
    : s === 404 ? '저장소를 찾지 못했어요. 이름과, 토큰에 이 저장소를 골라 두었는지 확인하세요'
    : limited ? 'GitHub 요청 한도를 넘었어요. 잠시 뒤에 다시 해 보세요'
    : s === 403 ? '토큰에 이 저장소의 Contents 읽기 권한이 없어요'
    : `GitHub 오류(${s})`);
}

// NFKC + lower case, so a name typed on a Mac (NFD kana), full-width ～？ and case all compare equal
const normKey = (s) => String(s).normalize('NFKC').toLowerCase().replace(/\s+/g, ' ').trim();
const codeOf = (s) => { const m = /(?:^|[^a-z0-9])(rj\d{6}(?:\d{2})?)(?!\d)/.exec(normKey(s)); return m ? m[1] : ''; };
// 'tr01_…', '01_…', '1.…', '00. …', 'RJ01234567_03' -> the track number
function trackNum(s) {
  const m = /^(?:tr(?:ack)?)?[\s_.#-]*(\d{1,3})(?!\d)/.exec(normKey(s).replace(/rj\d{6}(?:\d{2})?/g, '').replace(/^[\s_.-]+/, ''));
  return m ? +m[1] : null;
}

// works: repository folder -> its tracks by normalized name · byCode: RJ code -> folders · byKey: track name -> [folder, track]
function buildRepoIndex(files) {
  if (files.some(([p]) => p.startsWith('subtitles/'))) files = files.filter(([p]) => p.startsWith('subtitles/'));
  const works = new Map(), byCode = new Map(), byKey = new Map();
  for (const [path, sha] of files) {
    const p = splitName(path);
    let base = p.base, lang = '';
    const lm = /\.([a-z]{2,3})$/i.exec(base);
    if (lm && (JA_TAG.test(lm[1]) || KO_TAG.test(lm[1]))) { lang = JA_TAG.test(lm[1]) ? 'ja' : 'ko'; base = base.slice(0, -lm[0].length); }
    if (!base || !LYRIC_EXT.has(p.ext)) continue;
    let w = works.get(p.dir);
    if (!w) {
      const name = p.dir.split('/').pop() || p.dir;
      const words = normKey(name).split(/[\s[\]【】()「」『』_・,、]+/).filter((x) => x.length >= 2);
      w = { dir: p.dir, name, code: codeOf(name), words, tracks: new Map(), nums: new Map() };
      works.set(p.dir, w);
    }
    const key = normKey(base);
    let tr = w.tracks.get(key);
    if (!tr) { tr = { name: base, lrc: null, srt: null, ja: null }; w.tracks.set(key, tr); }
    const f = { sha, ext: p.ext };
    if (lang === 'ja') { if (!tr.ja || p.ext !== 'lrc') tr.ja = f; }
    else if (p.ext === 'lrc') tr.lrc = f;
    else if (!tr.srt || lang === 'ko') tr.srt = f;
  }
  for (const w of works.values()) {
    if (w.code) { if (!byCode.has(w.code)) byCode.set(w.code, []); byCode.get(w.code).push(w); }
    for (const [key, tr] of w.tracks) {
      if (!byKey.has(key)) byKey.set(key, []);
      byKey.get(key).push([w, tr]);
      const n = trackNum(tr.name);
      if (n != null) { if (!w.nums.has(n)) w.nums.set(n, []); w.nums.get(n).push(tr); }
    }
  }
  return { works, byCode, byKey };
}

// A song's RJ code (its file name first, then its folders from the inside out) picks the repository folders,
// where the track is found by name (Japanese, or Korean through 트랙명.md), or by track number when that is unique.
// Without a code: a track of the same name in a folder named after the voice actor, else anywhere in the repository.
function matchRepo(list) {
  const idx = repo.idx, found = new Map(), score = new Map();
  for (const it of list) {
    it.repo = null;
    if (!idx) continue;
    const segs = (it.dir ? it.dir.split('/') : []).concat(it.base).map(normKey);
    let code = '';
    for (let i = segs.length - 1; i >= 0 && !code; i--) code = codeOf(segs[i]);
    const key = normKey(it.base);
    let cands = [];
    if (code) {
      const ws = idx.byCode.get(code) || [];
      for (const w of ws) { const tr = w.tracks.get(key) || koAlias(w, key); if (tr) cands.push({ w, tr, how: 'code' }); }
      const n = cands.length ? null : trackNum(it.base);
      if (n != null) for (const w of ws) { const t = w.nums.get(n); if (t && t.length === 1) cands.push({ w, tr: t[0], how: 'num' }); }
    } else {
      let hits = idx.byKey.get(key) || [];
      if (!hits.length && repo.ko) for (const w of idx.works.values()) { const tr = koAlias(w, key); if (tr) hits.push([w, tr]); }
      const actor = hits.filter(([w]) => !w.code && w.words.some((x) => segs.some((s) => s.includes(x))));
      cands = (actor.length ? actor : hits).map(([w, tr]) => ({ w, tr, how: actor.length ? 'actor' : 'name' }));
    }
    if (!cands.length) continue;
    const group = code || '@' + it.dir;   // a choice between folders holds for the whole work
    found.set(it, { cands, group });
    for (const w of new Set(cands.map((c) => c.w))) score.set(group + '\n' + w.dir, (score.get(group + '\n' + w.dir) || 0) + 1);
  }
  for (const [it, { cands, group }] of found) {
    const chosen = repo.picks[group];
    const sc = (c) => score.get(group + '\n' + c.w.dir) || 0, numbered = (c) => /_\d+$/.test(c.w.name);
    // the folder picked in the settings, then the one most of this folder's songs fit, then 'work' over 'work_2'
    cands.sort((a, b) => (b.w.dir === chosen) - (a.w.dir === chosen) || sc(b) - sc(a)
      || numbered(a) - numbered(b) || a.w.name.length - b.w.name.length);
    const top = cands[0], next = cands.find((c) => c.w !== top.w);
    // the same file name in two different works and nothing to tell them apart: better no subtitles than wrong ones
    if (top.how === 'name' && next && sc(next) === sc(top) && (!top.w.code || next.w.code !== top.w.code) && top.w.dir !== chosen) continue;
    const alts = [];
    for (const c of cands) if (!alts.some((a) => a.dir === c.w.dir)) alts.push({ dir: c.w.dir, name: c.w.name });
    alts.sort((a, b) => collator.compare(a.name, b.name));   // same order in the settings whichever is picked
    it.repo = { dir: top.w.dir, name: top.w.name, track: top.tr.name, how: top.how, group, alts, lrc: top.tr.lrc, srt: top.tr.srt, ja: top.tr.ja };
  }
  lyricVer++;
}

const repoSig = (it) => (it && it.repo && repo.cfg.on ? [it.repo.lrc, it.repo.srt, it.repo.ja].map((f) => (f ? f.sha : '')).join() : '');
function repoRematch() {
  const c = cur(), before = repoSig(c);
  matchRepo(state.queue);
  renderQueue();
  if (repoSig(c) !== before) loadLyrics();
  paintRepoStatus();
}

function repoSrc(f) {
  if (!f) return null;
  let s = repoSrcs.get(f.sha);
  if (!s) { s = { repoSha: f.sha, ext: f.ext }; repoSrcs.set(f.sha, s); }
  return s;
}

function repoText(sha) {
  let p = blobJobs.get(sha);
  if (p) return p;
  p = (async () => {
    const hit = await kv.get('b:' + sha);
    if (typeof hit === 'string') return hit;
    if (!repo.cfg.token) throw new Error('자막 저장소가 연결되어 있지 않아요');
    const j = await gh(`${rp()}/git/blobs/${sha}`, repo.cfg.token);
    const bin = atob(String(j.content || '').replace(/\s+/g, ''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const text = await readText(new Blob([bytes]));
    await kv.set('b:' + sha, text);
    return text;
  })();
  blobJobs.set(sha, p);
  p.then(() => blobJobs.delete(sha), () => blobJobs.delete(sha));
  return p;
}

/* Korean titles the repository lists in its README.md files (written by its subtitle tools):
   subtitles/README.md      <!-- original folder name -->  then  **Korean title**\
   subtitles/<folder>/README.md   1. Korean title <!-- original track name -->
   An HTML comment can't hold '--', so the tools write it as '- -'. Titles still marked '번역 필요: ' are left out. */
const MD_KEY = /^<!--\s*(.*?)\s*-->\s*$/;
const MD_WORK = /^\*\*(?:\[((?:\\.|[^\]\\])*)\]\([^)]*\)|((?:\\.|[^*\\])*))\*\*\\?\s*$/;
const MD_ITEM = /^\d+\.\s+(.*?)\s*(?:<!--\s*(.*?)\s*-->)?\s*$/;
const koKey = (name) => normKey(String(name).replace(/--/g, '- -'));
function parseKoTitles(text) {
  const out = [];
  let key = null, m;
  for (const line of text.replace(/\r\n?/g, '\n').split('\n')) {
    if ((m = MD_KEY.exec(line))) { key = m[1]; continue; }
    if ((m = MD_WORK.exec(line))) { if (key != null) out.push([key, m[1] != null ? m[1] : m[2]]); key = null; continue; }
    if ((m = MD_ITEM.exec(line)) && m[2]) out.push([m[2], m[1].replace(/\s+·\s+음성 \d+개$/, '')]);
  }
  return out.map(([k, t]) => [normKey(k), t.replace(/\\(.)/g, '$1').trim()]).filter(([, t]) => t && !t.startsWith('번역 필요:'));
}
/* A work folder's 트랙명.md (written by the repository's names tool): the work's Korean name and a table of its
   track file names, Japanese ↔ Korean. Markdown signs in a cell are escaped with '\', a '|' as '\|'.
     - 한국어: Korean work name
     | 번호 | 일본어 파일명 | 한국어 파일명 |
     | 1 | 1.コスプレ… | 1.코스프레… |                                                          */
const NAMES_FILE = '트랙명.md';
function mdCells(s) {
  const out = [];
  let cell = '';
  for (let i = 0; i < s.length; i++) {
    if (s[i] === '\\' && i + 1 < s.length) cell += s[++i];
    else if (s[i] === '|') { out.push(cell.trim()); cell = ''; }
    else cell += s[i];
  }
  out.push(cell.trim());
  return out;
}
function parseNames(text) {
  let title = '', m;
  const rows = [];
  for (const line of text.replace(/\r\n?/g, '\n').split('\n')) {
    if ((m = /^-\s*한국어:\s*(.*?)\s*$/.exec(line))) { title = m[1].replace(/\\(.)/g, '$1'); continue; }
    if (!(m = /^\|(.*)\|\s*$/.exec(line))) continue;
    const cells = mdCells(m[1]), ja = cells[cells.length - 2], ko = cells[cells.length - 1];
    if (cells.length < 2 || ko === '한국어 파일명' || !/[^-:\s]/.test(cells.join(''))) continue;   // the head row, the rule under it
    if (ja && ko) rows.push([ja, ko]);
  }
  return { title, rows };
}
// runs fn over the list, n at a time
async function eachLimit(list, n, fn) {
  let i = 0;
  const worker = async () => { while (i < list.length) await fn(list[i++]); };
  await Promise.all(Array.from({ length: Math.min(n, list.length) }, worker));
}
// the list of works sits next to the work folders; a folder's own README.md names its tracks, its 트랙명.md too
async function readKoTitles(tree, files) {
  const root = files.some(([p]) => p.startsWith('subtitles/')) ? 'subtitles/' : '';
  const ko = { root, works: [], tracks: [], names: [] };
  const isNames = (x) => x.path.normalize('NFC').endsWith('/' + NAMES_FILE);
  const todo = tree.filter((x) => x.type === 'blob' && x.path.startsWith(root)
    && (/^(?:[^/]+\/)?README\.md$/i.test(x.path.slice(root.length)) || isNames(x)));
  await eachLimit(todo, 6, async (x) => {
    const text = await repoText(x.sha), dir = x.path.slice(0, x.path.lastIndexOf('/'));
    if (isNames(x)) { const n = parseNames(text); ko.names.push([dir, n.title, n.rows]); return; }
    const pairs = parseKoTitles(text);
    if (x.path.slice(root.length).includes('/')) for (const [k, t] of pairs) ko.tracks.push([dir, k, t]);
    else ko.works.push(...pairs);
  });
  return ko;
}
// a list kept before 트랙명.md was read has no names: such a list is fetched once more
const koFresh = (t) => !!(t && t.ko && t.ko.names);
// the 트랙명.md of a repository folder: its own, or the work folder's it sits in (…/work/SEなし)
function namesTable(dir) {
  if (!repo.ko) return null;
  for (let d = dir; d; d = d.slice(0, Math.max(0, d.lastIndexOf('/')))) { const t = repo.ko.names.get(d); if (t) return t; }
  return null;
}
// the Korean names the repository lists for a matched song's work and track: its 트랙명.md, then the README lists
function koTitles(r) {
  const ko = repo.ko;
  if (!ko || !r) return {};
  const top = r.dir.startsWith(ko.root) ? r.dir.slice(ko.root.length).split('/')[0] : '';
  const t = namesTable(r.dir);
  return {
    work: (t && t.title) || ko.works.get(koKey(top)) || '',
    track: (t && t.ko.get(normKey(r.track))) || ko.tracks.get(r.dir + '\n' + koKey(r.track)) || '',
  };
}
// a song renamed to its Korean name (the repository's name-switch bat does that) finds its track through 트랙명.md
function koAlias(w, key) {
  const t = namesTable(w.dir), ja = t && t.back.get(key);
  return (ja && w.tracks.get(ja)) || null;
}

function applyTree(t) {
  repo.tree = t;
  repo.idx = buildRepoIndex(t.files);
  repo.ko = t.ko ? {
    root: t.ko.root, works: new Map(t.ko.works), tracks: new Map(t.ko.tracks.map(([d, k, v]) => [d + '\n' + k, v])),
    // folder -> { title, ko: Japanese name -> Korean, back: Korean name -> Japanese (normalized) }
    names: new Map((t.ko.names || []).map(([d, title, rows]) => [d, {
      title,
      ko: new Map(rows.map(([ja, ko]) => [normKey(ja), ko])),
      back: new Map(rows.map(([ja, ko]) => [normKey(ko), normKey(ja)])),
    }])),
  } : null;
  repo.checkedAt = t.at || 0;
}
async function repoLoadCached() {
  const t = await kv.get('tree');
  if (t && t.repo === repo.cfg.name && !repo.idx) {
    applyTree(t);
    if (state.queue.length) repoRematch();
  }
}

// One small request for the branch head; the file list is fetched again only when the head has moved.
function repoSync(force) {
  if (repo.syncing) return repo.syncing;
  repo.syncing = (async () => {
    try {
      await repo.loading;
      if (!repo.cfg.token) return false;
      if (!force && repo.idx && koFresh(repo.tree) && Date.now() - repo.checkedAt < 10 * 60000) return false;
      const { name, token } = repo.cfg;
      setRepoStatus('busy');
      const branch = repo.cfg.branch || (await gh(rp(name), token)).default_branch || 'main';
      const head = await gh(`${rp(name)}/branches/${encodeURIComponent(branch)}`, token);
      let changed = false;
      if (!repo.tree || repo.tree.commit !== head.commit.sha || !koFresh(repo.tree)) {
        const t = await gh(`${rp(name)}/git/trees/${head.commit.commit.tree.sha}?recursive=1`, token);
        if (repo.cfg.name !== name) return false;   // switched to another repository meanwhile
        const files = t.tree.filter((x) => x.type === 'blob' && /\.(lrc|srt|vtt)$/i.test(x.path)).map((x) => [x.path, x.sha]);
        let ko;
        try { ko = await readKoTitles(t.tree, files); } catch (e) { /* no titles this time; read again next check */ }
        if (repo.cfg.name !== name) return false;
        applyTree({ repo: name, commit: head.commit.sha, at: Date.now(), files, ko });
        changed = true;
      } else {
        repo.tree.at = repo.checkedAt = Date.now();
      }
      if (repo.cfg.name !== name) return false;
      repo.cfg.branch = branch;
      saveRepoCfg();
      kv.set('tree', repo.tree);
      setRepoStatus('ok');
      return changed;
    } catch (e) {
      setRepoStatus('err', e.message);
      return false;
    } finally {
      repo.syncing = null;
    }
  })();
  return repo.syncing;
}

// Right after songs are added: fetch every matched song's files, the current song first, four at a time.
function repoPrefetch() {
  repo.fetching = repo.fetching.then(async () => {
    if (!repoReady()) return;
    const c = cur(), shas = new Set();
    const list = state.queue.filter((x) => x.repo).sort((a, b) => (b === c) - (a === c));
    for (const it of list) for (const f of [it.repo.lrc, it.repo.srt, it.repo.ja]) if (f) shas.add(f.sha);
    const todo = [];
    for (const s of shas) if (typeof (await kv.get('b:' + s)) !== 'string') todo.push(s);
    if (!todo.length) return;
    repo.dl = { done: 0, total: todo.length, failed: 0 };
    paintRepoStatus();
    let i = 0;
    const worker = async () => {
      while (i < todo.length) {
        const s = todo[i++];
        try { await repoText(s); } catch (e) { repo.dl.failed++; }
        repo.dl.done++;
        paintRepoStatus();
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
    const failed = repo.dl.failed;
    repo.dl = null;
    paintRepoStatus();
    if (failed) toast(`저장소 자막 ${failed}개를 받지 못했어요. 곡을 재생할 때 다시 받아요`);
  }).catch(() => { repo.dl = null; });
}

// after adding songs: the list was matched against the kept file list already; check for a newer one, then fetch
async function repoAfterAdd() {
  if (!repoReady()) return;
  const count = () => state.queue.filter((x) => x.repo).length, before = count();
  if (await repoSync(false)) {
    repoRematch();
    const n = count();
    if (n !== before) toast(n ? `저장소에서 ${n}곡의 자막을 찾았어요` : '저장소에 이 곡들의 자막이 없어요');
  } else if (repo.status === 'err') toast(`자막 저장소: ${repo.msg}`);   // e.g. an expired token
  repoPrefetch();
}

/* ---------- playback ---------- */
let curUrl = null, pendingSeek = 0, autoAdvance = false, errorStreak = 0, artUrl = null;

function loadItem(it, opts = {}) {
  const prevUrl = curUrl;
  state.curId = it.id;
  state.played.add(it.id);
  curUrl = URL.createObjectURL(it.file);
  audio.src = curUrl;
  if (prevUrl && prevUrl !== curUrl) URL.revokeObjectURL(prevUrl);
  audio.defaultPlaybackRate = state.rate;
  audio.playbackRate = state.rate;
  pendingSeek = opts.startAt || 0;
  autoAdvance = !!opts.auto;
  if (opts.autoplay) doPlay();
  onTrackChanged();
}

function go(it, opts = {}) {
  if (!it) return;
  const c = cur();
  if (c && c.id !== it.id) {
    state.history.push(c.id);
    if (state.history.length > 300) state.history.shift();
  }
  loadItem(it, opts);
}

function clearPlayer() {
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  if (curUrl) URL.revokeObjectURL(curUrl);
  curUrl = null;
  state.curId = null;
  onTrackChanged();
}

function doPlay() {
  const p = audio.play();
  if (p && p.catch) p.catch((err) => { if (err && err.name === 'NotAllowedError') toast('재생 버튼을 눌러 시작해주세요'); });
}

function togglePlay() {
  if (!cur()) {
    const first = state.queue.find((x) => !x.bad);
    if (first) go(first, { autoplay: true });
    return;
  }
  if (audio.paused) doPlay(); else audio.pause();
}

function neighbor(dir, wrap, fromId = state.curId, exclude = null) {
  const q = state.queue, n = q.length;
  if (!n) return null;
  let i = fromId ? idxOf(fromId) : -1;
  if (i < 0) i = dir > 0 ? -1 : n;
  for (let step = 1; step <= n; step++) {
    let j = i + dir * step;
    if (j < 0 || j >= n) { if (!wrap) return null; j = ((j % n) + n) % n; }
    const it = q[j];
    if (it.id !== fromId && !it.bad && !(exclude && exclude.has(it.id))) return it;
  }
  return null;
}

function shufflePick(exclude = null) {
  const pool = state.queue.filter((x) => !x.bad && x.id !== state.curId && !(exclude && exclude.has(x.id)));
  if (!pool.length) return null;
  let fresh = pool.filter((x) => !state.played.has(x.id));
  if (!fresh.length) {
    state.played.clear();
    if (state.curId) state.played.add(state.curId);
    fresh = pool;
  }
  return fresh[Math.floor(Math.random() * fresh.length)];
}

function nextManual() {
  if (!cur()) { togglePlay(); return; }
  const playing = !audio.paused;
  const it = state.mode === 'shuffle' ? shufflePick() : neighbor(+1, true);
  if (it) go(it, { autoplay: playing });
}

function prevManual() {
  if (!cur()) return;
  const playing = !audio.paused;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  let it = null;
  if (state.mode === 'shuffle') {
    while (state.history.length && !it) { const x = byId(state.history.pop()); if (x && !x.bad) it = x; }
  } else {
    it = neighbor(-1, state.mode === 'repeatAll');
  }
  if (it) loadItem(it, { autoplay: playing }); else audio.currentTime = 0;
}

function skipBy(sec) {
  if (!(audio.duration > 0)) return;
  audio.currentTime = clamp(audio.currentTime + sec, 0, Math.max(0, audio.duration - 0.25));
  renderProgress(); tickLyrics();
}

// the next song after the current one ends, per mode; 'same' means replay the current song
function pickAfterEnd() {
  const c = cur();
  switch (state.mode) {
    case 'one': return null;
    case 'repeatOne': return 'same';
    case 'all': return neighbor(+1, false);
    case 'repeatAll': return neighbor(+1, true) || (c && !c.bad ? 'same' : null);
    case 'shuffle': return shufflePick() || (c && !c.bad ? 'same' : null);
  }
  return null;
}

audio.addEventListener('ended', () => {
  if (state.sleepEnd) {
    setSleep('off');
    toast('수면 타이머: 곡이 끝나서 멈췄어요');
    saveSession(true);
    return;
  }
  const next = pickAfterEnd();
  if (next === 'same') { audio.currentTime = 0; doPlay(); }
  else if (next) go(next, { autoplay: true, auto: true });
  else { renderProgress(); saveSession(true); }
});

audio.addEventListener('error', () => {
  const c = cur();
  if (!c || !audio.getAttribute('src')) return;
  c.bad = true;
  errorStreak++;
  renderQueue();
  let next = null;
  if (autoAdvance && errorStreak < state.queue.length && state.mode !== 'repeatOne' && state.mode !== 'one') {
    next = state.mode === 'shuffle' ? shufflePick() : neighbor(+1, state.mode === 'repeatAll');
  }
  toast(next ? `재생할 수 없는 파일이라 넘어갔어요: ${c.name}` : `재생할 수 없는 파일이에요: ${c.name}`);
  if (next) go(next, { autoplay: true, auto: true });
});

audio.addEventListener('playing', () => { errorStreak = 0; });
audio.addEventListener('loadedmetadata', () => {
  if (pendingSeek > 0) { audio.currentTime = Math.min(pendingSeek, Math.max(0, audio.duration - 1)); pendingSeek = 0; }
  renderProgress(); setPos();
});
audio.addEventListener('play', () => { renderPlayState(); kick(); syncWake(); });
audio.addEventListener('pause', () => { renderPlayState(); renderProgress(); syncWake(); saveSession(true); });
audio.addEventListener('seeked', () => { renderProgress(); tickLyrics(); setPos(); });
audio.addEventListener('ratechange', setPos);
audio.addEventListener('timeupdate', () => { renderProgress(); tickLyrics(); checkSleep(); saveSession(false); });

/* ---------- loop for smooth progress + lyrics while visible ---------- */
let raf = 0;
function frame() {
  raf = 0;
  renderProgress();
  tickLyrics();
  if (!audio.paused && document.visibilityState === 'visible') raf = requestAnimationFrame(frame);
}
function kick() { if (!raf) raf = requestAnimationFrame(frame); }

/* ---------- now playing + progress ---------- */
function onTrackChanged() {
  highlightQueue();
  renderNow();
  renderProgress();
  renderPlayState();
  loadLyrics();
  saveSession(true);
}

function renderNow() {
  renderAlbum();
  const c = cur();
  const n = state.queue.length;
  const names = c ? shownNames(c) : null;
  els.nowTitle.textContent = c ? names.song[0] : n ? '재생할 곡을 골라주세요' : '곡을 추가해주세요';
  updateMediaMeta(names);
  if (!c) { els.nowSub.textContent = ''; return; }
  const bits = [`${idxOf(c.id) + 1} / ${n}`];
  if (names.folder) bits.push(names.folder);
  if (c.ext) bits.push(c.ext.toUpperCase());
  els.nowSub.textContent = bits.join(' · ');
}

let seeking = false, seekPreview = 0;
function paintProgress(t, d) {
  const p = d > 0 ? clamp(t / d, 0, 1) : 0;
  els.seekFill.style.width = (p * 100) + '%';
  els.seekThumb.style.left = (p * 100) + '%';
  els.tCur.textContent = fmt(t);
  els.tRem.textContent = d > 0 ? '-' + fmt(Math.max(0, d - t) + 0.999) : '0:00';
  els.seek.setAttribute('aria-valuemax', String(Math.floor(d || 0)));
  els.seek.setAttribute('aria-valuenow', String(Math.floor(t)));
  els.seek.setAttribute('aria-valuetext', `${fmt(t)} / ${fmt(d || 0)}`);
}
function renderProgress() {
  if (seeking) return;
  paintProgress(cur() ? audio.currentTime || 0 : 0, cur() ? audio.duration : 0);
}
function renderPlayState() {
  const playing = !audio.paused && !!cur();
  document.body.classList.toggle('playing', playing);
  els.playIcon.setAttribute('href', playing ? '#i-pause' : '#i-play');
  els.bPlay.setAttribute('aria-label', playing ? '일시정지' : '재생');
  if (ms) { try { ms.playbackState = playing ? 'playing' : 'paused'; } catch (e) { /* ignore */ } }
}

function seekFromX(x) {
  const r = els.seekTrack.getBoundingClientRect();
  const p = clamp((x - r.left) / r.width, 0, 1);
  seekPreview = p * (audio.duration || 0);
  paintProgress(seekPreview, audio.duration);
}
function endSeek(commit) {
  if (!seeking) return;
  seeking = false;
  els.seek.classList.remove('active');
  if (commit && audio.duration > 0) { audio.currentTime = seekPreview; tickLyrics(true); }
  renderProgress();
}
els.seek.addEventListener('pointerdown', (e) => {
  if (!cur() || !(audio.duration > 0)) return;
  seeking = true;
  try { els.seek.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  els.seek.classList.add('active');
  seekFromX(e.clientX);
  e.preventDefault();
});
els.seek.addEventListener('pointermove', (e) => { if (seeking) seekFromX(e.clientX); });
els.seek.addEventListener('pointerup', () => endSeek(true));
els.seek.addEventListener('pointercancel', () => endSeek(false));
els.seek.addEventListener('lostpointercapture', () => endSeek(true));
els.seek.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { skipBy(-5); e.preventDefault(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { skipBy(5); e.preventDefault(); }
  else if (e.key === 'Home' && audio.duration > 0) { audio.currentTime = 0; e.preventDefault(); }
});

els.bPlay.addEventListener('click', togglePlay);
els.bPrev.addEventListener('click', prevManual);
els.bNext.addEventListener('click', nextManual);
els.bBack.addEventListener('click', () => skipBy(-state.skip));
els.bFwd.addEventListener('click', () => skipBy(state.skip));
function renderSkip() {
  for (const b of [els.bBack, els.bFwd]) b.querySelector('text').textContent = state.skip;
  els.bBack.setAttribute('aria-label', `${state.skip}초 뒤로`);
  els.bFwd.setAttribute('aria-label', `${state.skip}초 앞으로`);
}

/* ---------- lock screen controls ---------- */
const ms = 'mediaSession' in navigator ? navigator.mediaSession : null;
// names: the current song's shownNames, or null. Set only when it changes (the dock renders often).
let metaKey = null;
function updateMediaMeta(names) {
  if (!ms || typeof MediaMetadata === 'undefined') return;
  const key = names ? [names.song[0], names.folder, !!artUrl].join('\n') : '';
  if (key === metaKey) return;
  metaKey = key;
  try {
    ms.metadata = names ? new MediaMetadata({
      title: names.song[0],
      artist: names.folder,
      album: '<mark>',
      artwork: artUrl ? [{ src: artUrl, sizes: '256x256', type: 'image/png' }] : [],
    }) : null;
  } catch (e) { /* ignore */ }
}
function setPos() {
  if (!ms || !ms.setPositionState || !(audio.duration > 0) || !isFinite(audio.duration)) return;
  try { ms.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate || 1, position: clamp(audio.currentTime, 0, audio.duration) }); } catch (e) { /* ignore */ }
}
if (ms) {
  const h = (a, f) => { try { ms.setActionHandler(a, f); } catch (e) { /* unsupported */ } };
  h('play', () => { if (cur()) doPlay(); else togglePlay(); });
  h('pause', () => audio.pause());
  h('previoustrack', prevManual);
  h('nexttrack', nextManual);
  h('seekto', (d) => { if (d && isFinite(d.seekTime)) { audio.currentTime = d.seekTime; setPos(); } });
}

/* ---------- queue ---------- */
function rowHTML(it) {
  const ly = findLyrics(it);
  const isCur = it.id === state.curId, sel = state.selected.has(it.id);
  const chips = [];
  if (it.ext) chips.push(`<span class="chip">${esc(it.ext.toUpperCase())}</span>`);
  if (ly.repo) chips.push('<span class="chip ly">저장소</span>');
  if (ly.lrc) chips.push('<span class="chip ly">LRC</span>');
  if (ly.srt) chips.push('<span class="chip ly">SRT</span>');
  if (it.bad) chips.push('<span class="chip warn">재생 불가</span>');
  const lead = state.select
    ? '<span class="check"><svg><use href="#i-check"/></svg></span>'
    : '<svg><use href="#i-grip"/></svg>';
  const { song: [name, name2], album } = shownNames(it);
  return `<li class="row${isCur ? ' cur' : ''}${it.bad ? ' bad' : ''}${sel ? ' sel' : ''}" data-id="${it.id}">`
    + `<span class="grip" aria-hidden="true">${lead}</span>`
    + `<button class="title-btn" type="button"${state.select ? ` aria-pressed="${sel}"` : ''}><span class="t"${jaLang(name)}>${esc(name)}</span>`
    + (name2 ? `<span class="t2"${jaLang(name2)}>${esc(name2)}</span>` : '')
    + `<span class="meta"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>${chips.join('')}${album ? `<span class="dir">${esc(album)}</span>` : ''}</span></button>`
    + (state.select ? '' : `<button class="rm" type="button" aria-label="${esc(name)} 목록에서 빼기"><svg><use href="#i-x"/></svg></button>`)
    + '</li>';
}

let drag = null, needRender = false;
function renderQueue() {
  if (drag) { needRender = true; return; }
  const n = state.queue.length;
  els.qCount.textContent = String(n);
  els.queue.innerHTML = state.queue.map(rowHTML).join('');
  els.qEmpty.hidden = n > 0;
  els.selStart.disabled = n === 0;
  renderNote();
  renderSelBar();
  renderNow();
}

function highlightQueue() {
  for (const li of els.queue.children) li.classList.toggle('cur', li.dataset.id === state.curId);
}

function renderNote() {
  let html = '';
  if (!state.queue.length && saved && Array.isArray(saved.items) && saved.items.length) {
    html = `<b>지난번 목록 ${saved.items.length}곡</b>${saved.name ? ` · ‘${esc(saved.name)}’ ${fmt(saved.t || 0)}에서 멈춤` : ''}<br>같은 폴더나 파일을 다시 추가하면 순서와 위치를 이어서 불러와요.`;
  }
  els.qNote.innerHTML = html;
  els.qNote.hidden = !html;
}

function renderSelBar() {
  const n = state.queue.length, k = state.selected.size;
  els.qBar.hidden = state.select || !state.queue.length;   // empty: the big buttons instead
  els.selBar.hidden = !state.select;
  els.selActs.hidden = !state.select;
  if (!els.toast.hidden) placeToast();
  els.selCount.textContent = `${k}곡 선택`;
  els.selAll.textContent = k === n && n > 0 ? '선택 해제' : '전체 선택';
  els.selRemove.disabled = k === 0;
  els.selKeep.disabled = k === 0 || k === n;
}

function setSelect(on) {
  state.select = on;
  state.selected.clear();
  renderQueue();
}
function toggleSel(id) {
  if (state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
  const li = els.queue.querySelector(`.row[data-id="${id}"]`);
  if (li) {
    li.classList.toggle('sel', state.selected.has(id));
    const b = li.querySelector('.title-btn');
    if (b) b.setAttribute('aria-pressed', String(state.selected.has(id)));
  }
  renderSelBar();
}

els.selStart.addEventListener('click', () => setSelect(true));
els.selDone.addEventListener('click', () => setSelect(false));
els.selAll.addEventListener('click', () => {
  if (state.selected.size === state.queue.length) state.selected.clear();
  else state.queue.forEach((x) => state.selected.add(x.id));
  renderQueue();
});
els.selRemove.addEventListener('click', () => { const ids = [...state.selected]; state.select = false; state.selected.clear(); removeIds(ids); });
els.selKeep.addEventListener('click', () => { const keep = state.selected; const ids = state.queue.filter((x) => !keep.has(x.id)).map((x) => x.id); state.select = false; state.selected = new Set(); removeIds(ids); });

els.queue.addEventListener('click', (e) => {
  const row = e.target.closest('.row');
  if (!row) return;
  const it = byId(row.dataset.id);
  if (!it) return;
  if (state.select) { toggleSel(it.id); return; }
  if (e.target.closest('.rm')) { removeIds([it.id]); return; }
  if (e.target.closest('.title-btn')) {
    if (it.id === state.curId) { if (audio.paused) doPlay(); }
    else go(it, { autoplay: true });
  }
});

function removeIds(ids) {
  const rm = new Set(ids.filter((id) => byId(id)));
  if (!rm.size) { renderQueue(); return; }
  const before = state.queue.slice();
  const c = cur();
  const curGone = !!(c && rm.has(c.id));
  const playing = !audio.paused;
  let next = null;
  if (curGone) next = state.mode === 'shuffle' ? shufflePick(rm) : neighbor(+1, state.mode === 'repeatAll', c.id, rm);
  state.queue = state.queue.filter((x) => !rm.has(x.id));
  rm.forEach((id) => state.selected.delete(id));
  state.history = state.history.filter((id) => !rm.has(id));
  if (curGone) { if (next) loadItem(next, { autoplay: playing }); else clearPlayer(); }
  if (!state.queue.length) state.select = false;
  renderQueue();
  saveSession(true);
  toast(`${rm.size}곡을 목록에서 뺐어요`, '되돌리기', () => {
    const beforeIds = new Set(before.map((x) => x.id));
    state.queue = before.concat(state.queue.filter((x) => !beforeIds.has(x.id)));
    if (!cur()) { const first = state.queue.find((x) => !x.bad); if (first) loadItem(first); }
    renderQueue();
    saveSession(true);
  });
}

/* drag to reorder (grip only, so the list still scrolls normally) */
els.queue.addEventListener('pointerdown', (e) => {
  if (state.select || drag) return;
  const g = e.target.closest('.grip');
  if (!g) return;
  const row = g.closest('.row');
  if (!row) return;
  e.preventDefault();
  try { g.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  const r = row.getBoundingClientRect();
  drag = { row, pid: e.pointerId, y: e.clientY, grab: e.clientY - r.top, h: r.height, raf: 0 };
  row.classList.add('dragging');
  drag.raf = requestAnimationFrame(dragFrame);
});
window.addEventListener('pointermove', (e) => { if (drag && e.pointerId === drag.pid) drag.y = e.clientY; });
window.addEventListener('pointerup', (e) => { if (drag && e.pointerId === drag.pid) endDrag(); });
window.addEventListener('pointercancel', (e) => { if (drag && e.pointerId === drag.pid) endDrag(); });

function dragFrame() {
  if (!drag) return;
  const sr = els.qScroll.getBoundingClientRect(), edge = 60;
  let dy = 0;
  if (drag.y < sr.top + edge) dy = -Math.ceil((sr.top + edge - drag.y) / 5);
  else if (drag.y > sr.bottom - edge) dy = Math.ceil((drag.y - (sr.bottom - edge)) / 5);
  if (dy) els.qScroll.scrollTop += dy;
  const row = drag.row;
  const center = drag.y - drag.grab + drag.h / 2;
  let prev = row.previousElementSibling;
  while (prev) { const pr = prev.getBoundingClientRect(); if (center < pr.top + pr.height / 2) { row.after(prev); prev = row.previousElementSibling; } else break; }
  let next = row.nextElementSibling;
  while (next) { const nr = next.getBoundingClientRect(); if (center > nr.top + nr.height / 2) { row.before(next); next = row.nextElementSibling; } else break; }
  const natural = els.queue.getBoundingClientRect().top + row.offsetTop;
  row.style.transform = `translateY(${drag.y - drag.grab - natural}px)`;
  drag.raf = requestAnimationFrame(dragFrame);
}

function endDrag() {
  if (!drag) return;
  cancelAnimationFrame(drag.raf);
  const { row } = drag;
  row.classList.remove('dragging');
  row.style.transform = '';
  const map = new Map(state.queue.map((x) => [x.id, x]));
  state.queue = [...els.queue.children].map((li) => map.get(li.dataset.id)).filter(Boolean);
  drag = null;
  if (needRender) { needRender = false; renderQueue(); } else renderNow();
  saveSession(true);
}

/* ---------- adding files ---------- */
function tryRestore(items) {
  if (!saved || !Array.isArray(saved.items) || !saved.items.length) return null;
  const pool = items.slice(), ordered = [];
  let c = null;
  saved.items.forEach((s, i) => {
    let j = pool.findIndex((x) => x.key === s.k);
    if (j < 0) j = pool.findIndex((x) => x.nkey === s.nk);
    if (j < 0) return;
    const it = pool.splice(j, 1)[0];
    ordered.push(it);
    if (i === saved.cur) c = it;
  });
  if (!ordered.length) return null;
  return { items: ordered.concat(pool), cur: c, t: c ? saved.t || 0 : 0 };
}

// list: File objects from the pickers, or { file, path } from a drop (a dropped File carries no folder in its name)
function addFiles(list, opts = {}) {
  const files = Array.from(list || []).map((x) => (x instanceof File ? x : Object.assign(x.file, { dropPath: x.path })));
  const noSongsHere = '이 폴더에 바로 든 곡이 없어요. 곡이 든 폴더를 고르거나 설정 › 하위 폴더도 추가를 켜 주세요';
  if (!files.length) { if (opts.skippedDirs) toast(noSongsHere); return; }
  const audios = [];
  const have = new Set(state.queue.map((x) => x.key));
  let lyrCount = 0, dup = 0, deep = 0;
  for (const f of files) {
    const path = (f.dropPath || f.webkitRelativePath || f.name).replace(/^\/+/, '');
    const p = splitName(path);
    if (!p.name || p.name.startsWith('.')) continue;          // skip ._song.mp3 and other hidden files
    if (!state.subDirs && f.webkitRelativePath && path.split('/').length > 2) {  // a picked folder brings only its own files, not its subfolders'
      if (AUDIO_EXT.has(p.ext) || /^audio\//.test(f.type || '')) deep++;
      continue;
    }
    if (LYRIC_EXT.has(p.ext)) { registerLyric(f, p); lyrCount++; }
    else if (AUDIO_EXT.has(p.ext) || /^audio\//.test(f.type || '')) {
      const key = path + '|' + f.size;                         // same key as makeItem; re-adding a folder only adds new songs
      if (have.has(key)) { dup++; continue; }
      have.add(key);
      audios.push({ f, path });
    }
  }
  audios.sort((a, b) => collator.compare(a.path, b.path));
  let items = audios.map((a) => makeItem(a.f, a.path));

  let restore = null;
  if (items.length && !state.queue.length) {
    restore = tryRestore(items);
    if (restore) items = restore.items;
  }
  state.queue.push(...items);
  if (items.length) matchRepo(state.queue);   // against the kept file list; repoAfterAdd checks for a newer one

  if (restore && restore.cur) loadItem(restore.cur, { startAt: restore.t });
  else if (!cur() && items.length) loadItem(items[0]);
  else if (lyrCount) loadLyrics();
  renderQueue();
  saveSession(true);

  const skip = (dup ? ` · 이미 있는 ${dup}곡은 건너뛰었어요` : '') + (deep ? ` · 하위 폴더의 ${deep}곡은 넣지 않았어요` : '');
  const rk = repo.cfg.on ? items.filter((x) => x.repo).length : 0;
  const rs = rk ? ` · 저장소 자막 ${rk}곡` : '';
  if (restore && restore.cur) toast(`${items.length}곡 추가${rs} · 지난번 위치(${fmt(restore.t)})부터 이어서 들을 수 있어요`);
  else if (items.length && lyrCount) toast(`${items.length}곡과 가사 ${lyrCount}개를 추가했어요${rs}${skip}`);
  else if (items.length) toast(`${items.length}곡을 추가했어요${rs}${skip}`);
  else if (lyrCount) toast(`가사 ${lyrCount}개를 추가했어요${skip || '. 이름이 같은 곡에 붙어요'}`);
  else if (dup) toast(`${dup}곡 모두 이미 목록에 있어요`);
  else if (deep || opts.skippedDirs) toast(noSongsHere);
  else toast('추가할 수 있는 음악이나 가사 파일이 없어요');
  if (items.length) repoAfterAdd();
}

/* drop files or folders anywhere on the page (a computer, or an iPad side by side). A folder brings only its own
   files, like the folder picker, unless the settings say subfolders too. Every file drop is taken, so a missed one
   never makes the browser open the file in place of the app and drop the queue. Only a dashed frame shows while dragging. */
const isFileDrag = (e) => !!e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
let dragDepth = 0;
const dropFrame = (on) => { if (!on) dragDepth = 0; document.body.classList.toggle('dropping', on); };
window.addEventListener('dragenter', (e) => { if (!isFileDrag(e)) return; e.preventDefault(); if (++dragDepth === 1) dropFrame(true); });
window.addEventListener('dragover', (e) => { if (!isFileDrag(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
window.addEventListener('dragleave', (e) => { if (isFileDrag(e) && --dragDepth <= 0) dropFrame(false); });
window.addEventListener('drop', (e) => {
  if (!isFileDrag(e)) return;
  e.preventDefault();
  dropFrame(false);
  takeDrop(e.dataTransfer);
});
const entryFile = (en) => new Promise((res, rej) => en.file(res, rej));
async function readDir(dir) {
  const reader = dir.createReader(), all = [];
  for (;;) {
    const batch = await new Promise((res, rej) => reader.readEntries(res, rej));   // comes in pieces of up to 100
    if (!batch.length) return all;
    all.push(...batch);
  }
}
function takeDrop(dt) {
  // the drop's items can only be read during the event: take the entries now, the files after
  const entries = Array.from(dt.items || []).map((it) => (it.kind === 'file' && it.webkitGetAsEntry ? it.webkitGetAsEntry() : null));
  const loose = Array.from(dt.files || []);
  if (!entries.some(Boolean)) { addFiles(loose); return; }
  (async () => {
    const out = [];
    let skippedDirs = 0;
    const walk = async (dir, path) => {
      for (const c of await readDir(dir)) {
        if (c.isFile) out.push({ file: await entryFile(c), path: path + '/' + c.name });
        else if (!state.subDirs) skippedDirs++;
        else if (!c.name.startsWith('.')) await walk(c, path + '/' + c.name).catch(() => { /* unreadable: skip it */ });
      }
    };
    for (const en of entries) {
      if (!en) continue;
      try {
        if (en.isFile) out.push({ file: await entryFile(en), path: en.name });
        else if (en.isDirectory) await walk(en, en.name);
      } catch (err) { /* unreadable: skip it */ }
    }
    addFiles(out, { skippedDirs });
  })();
}

const lyr = { id: null, kind: null, data: null, active: -1, avail: { lrc: null, srt: null }, token: 0 };
let follow = true, idleTimer = 0, touching = false;

async function loadLyrics() {
  const c = cur();
  const token = ++lyr.token;
  lyr.id = c ? c.id : null; lyr.data = null; lyr.active = -1; lyr.kind = null;
  if (!c) { lyr.avail = { lrc: null, srt: null }; renderLyrBar(); showLyrEmpty('none'); return; }
  const av = findLyrics(c);
  lyr.avail = av;
  const kind = state.lyricSrc === 'srt' ? (av.srt ? 'srt' : av.lrc ? 'lrc' : null) : (av.lrc ? 'lrc' : av.srt ? 'srt' : null);
  lyr.kind = kind;
  renderLyrBar();
  if (!kind) { showLyrEmpty('missing', c); return; }
  let text;
  try { text = await getText(av[kind]); }
  catch (e) { if (token === lyr.token) showLyrEmpty(av[kind].repoSha ? 'repoError' : 'error', c); return; }
  if (token !== lyr.token) return;
  const data = kind === 'lrc' ? parseLRC(text) : parseSRT(text);
  if (!data.groups.length) { showLyrEmpty('blank', c); return; }
  if (state.jaMode === 'both' && av.ja && av.ja !== av[kind] && data.timed) {
    try {
      const jt = await getText(av.ja);
      if (token !== lyr.token) return;
      addJapanese(data, /-->/.test(jt) ? parseSRT(jt) : parseLRC(jt));
    } catch (e) { /* Korean alone */ }
  }
  lyr.data = data;
  renderLyricLines();
}

// each Korean line gets the Japanese line that starts at the same moment (both come from one subtitle build)
function addJapanese(d, j) {
  if (!j.timed) return;
  let p = 0;
  for (const g of d.groups) {
    while (p < j.groups.length && j.groups[p].t < g.t - 0.6) p++;
    if (p < j.groups.length && Math.abs(j.groups[p].t - g.t) <= 0.6) g.ja = j.groups[p++].lines.filter(Boolean);
  }
}

const topGap = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--top-gap')) || 36;

function scrollToActive(instant) {

}

// The box stays put in the middle of the view; it only resizes to fit the current line
// and fades out while the lyrics are being scrolled by hand.
function placeFrame(gap) {
  const li = lyr.active >= 0 ? els.lyrics.children[lyr.active] : null;
  const show = !!(li && follow && lyr.data && lyr.data.timed && !els.lWrap.hidden);
  if (show) els.lFrame.style.height = li.offsetHeight + 'px';
  els.lFrame.classList.toggle('show', show);
  els.lFrame.classList.toggle('gap', !!gap);

function tickLyrics(force) {
  const d = lyr.data;
  if (!d || !d.timed) return;
  const c = cur();
  if (!c || c.id !== lyr.id) return;
  const now = audio.currentTime - offsetOf(c) + 0.05;
  const g = d.groups;
  let lo = 0, hi = g.length - 1, idx = -1;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (g[mid].t <= now) { idx = mid; lo = mid + 1; } else hi = mid - 1; }
  const kids = els.lyrics.children;
  const gap = idx >= 0 && lyr.kind === 'srt' && isFinite(g[idx].end) && now > g[idx].end;
  if (idx !== lyr.active || force) {
    if (lyr.active >= 0 && kids[lyr.active]) kids[lyr.active].classList.remove('on', 'gap');
    lyr.active = idx;
    if (idx >= 0 && kids[idx]) kids[idx].classList.add('on');
    placeFrame(gap);
    if (follow) scrollToActive(!!force);
  } else if (gap !== els.lFrame.classList.contains('gap')) {
    placeFrame(gap);
  }
  if (idx >= 0 && kids[idx]) kids[idx].classList.toggle('gap', gap);
}

/* ---------- album ---------- */
// folders that only say what is inside (…/mp3/, …/WAV版/, …/SEなし/) don't name the album
const FORMAT_DIR = /^(?:(?:mp3|wav|flac|m4a|aac|alac|ogg|opus|wma|hi-?res|audio)(?![a-z])|ハイレゾ|(?:音声|音源)(?:ファイル|データ)?版?$|本編$|se ?(?:あり|有り|なし|無し|on|off)(?![a-z]))/;
const stripCode = (s) => s.replace(/[[(【［（]?\s*rj\d{6}(?:\d{2})?\s*[\])】］）]?/gi, ' ')
  .replace(/\s{2,}/g, ' ').replace(/^[\s_.\-–—・:：]+|[\s_.\-–—・:：]+$/g, '');

// A song's work: its RJ code (file name first, then its folders from the inside out, then its subtitle folder)
// and names in each language, picked by the settings (pickName). The work as it is named: the local folder without
// the code, else the subtitle folder named after the work. In Japanese: that subtitle folder (the original title).
// In Korean: what the repository lists. The song: its file name, the subtitle file's (Japanese) and the Korean one listed.
function workOf(it) {
  const segs = it.dir ? it.dir.split('/') : [];
  const r = it.repo && repo.cfg.on ? it.repo : null;
  let code = codeOf(it.base), at = -1;
  for (let i = segs.length - 1; i >= 0 && !code; i--) if ((code = codeOf(segs[i]))) at = i;
  const rcode = r ? codeOf(r.name) : '';
  if (!code) code = rcode;                       // matched by name inside a work's subtitle folder
  const ko = koTitles(r);
  const ja = code && rcode === code ? stripCode(r.name.replace(/_\d+$/, '')) : '';
  let local = '';
  for (let i = segs.length - 1; i >= Math.max(at, 0) && !local; i--) if (!FORMAT_DIR.test(normKey(segs[i]))) local = stripCode(segs[i]);
  return {
    code,
    album: pickName({ orig: local || ja, ko: ko.work ? stripCode(ko.work) : '', ja }),   // [big, small], shown after the RJ code
    song: pickName({ orig: it.name, ko: ko.track || '', ja: r ? r.track : '' }),
    store: code ? `https://www.dlsite.com/maniax/work/=/product_id/${code.toUpperCase()}.html` : '',
    subs: r && repo.cfg.name ? repoFolderUrl(r.dir) : '',
  };
}
// [the name to show, a second one shown small under it or '']: the language the settings ask for,
// the name as it is when the repository lists none
function pickName(n) {
  const m = state.names;
  if (m === 'orig') return [n.orig, ''];
  const [a, b] = m === 'ko' || m === 'koja' ? [n.ko, n.ja] : [n.ja, n.ko];
  const big = a || n.orig;
  return [big, (m === 'koja' || m === 'jako') && b && normKey(b) !== normKey(big) ? b : ''];
}
// lang="ja" on a Japanese name (kana, no hangul): Japanese glyphs, and it wraps between any two letters as Japanese does
const jaLang = (s) => (/[\u3040-\u30ff]/.test(s) && !/[\uac00-\ud7a3]/.test(s) ? ' lang="ja"' : '');
// the song's names and the work's name for a row, the dock and the lock screen; as the files are named by default
function shownNames(it) {
  if (state.names === 'orig') return { song: [it.name, ''], album: it.dir || '', folder: it.dir ? it.dir.split('/').pop() : '' };
  const w = workOf(it), album = w.album[0] || (w.code ? w.code.toUpperCase() : it.dir || '');
  return { song: w.song, album, folder: album };
}

// DLsite keeps a work's main image under its code rounded up to the thousand: RJ01014447 -> RJ01015000/
function coverUrl(code) {
  const d = code.slice(2), dir = String(Math.ceil(+d / 1000) * 1000).padStart(d.length, '0');
  return `https://img.dlsite.jp/modpub/images2/work/doujin/RJ${dir}/${code.toUpperCase()}_img_main.jpg`;
}
const coverKV = idbKV('mark-covers');
const covers = new Map();       // RJ code -> object URL, or null when DLsite has no image for it
const coverJobs = new Map();
// fetched once and kept, so the cover also shows offline
function loadCover(code) {
  if (covers.has(code)) return Promise.resolve(covers.get(code));
  let p = coverJobs.get(code);
  if (p) return p;
  p = (async () => {
    let hit = await coverKV.get(code);
    if (!hit) {
      const r = await fetch(coverUrl(code), { referrerPolicy: 'no-referrer' });
      const type = r.headers.get('content-type') || '';
      if (r.status === 404 || (r.ok && !type.startsWith('image/'))) { covers.set(code, null); return null; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      hit = { type, buf: await r.arrayBuffer() };
      coverKV.set(code, hit);
    }
    const url = URL.createObjectURL(new Blob([hit.buf], { type: hit.type }));
    covers.set(code, url);
    return url;
  })();
  coverJobs.set(code, p);
  p.then(() => coverJobs.delete(code), () => coverJobs.delete(code));
  return p;
}

let coverCode = null, coverTok = 0, coverFailed = false;
function showCover(code, retry) {
  if (code === coverCode && !(retry && coverFailed)) return;
  coverCode = code;
  coverFailed = false;
  const tok = ++coverTok, box = els.aCover, img = els.aImg;
  img.hidden = true;
  img.removeAttribute('src');
  box.classList.remove('has');
  box.classList.toggle('none', !code);
  if (!code) return;
  loadCover(code).then((url) => {
    if (tok !== coverTok) return;
    if (url) img.src = url; else box.classList.add('none');
  }, () => {
    if (tok === coverTok) img.src = coverUrl(code);   // couldn't keep a copy: let the image load directly
  });
}
const retryCover = () => { if (coverFailed) showCover(coverCode, true); };
els.aImg.addEventListener('load', () => { els.aImg.hidden = false; els.aCover.classList.add('has'); });
els.aImg.addEventListener('error', () => {
  if (!els.aImg.getAttribute('src')) return;
  els.aImg.hidden = true;
  els.aCover.classList.add('none');
  coverFailed = true;   // offline: try again when the tab is opened or the connection is back
});
window.addEventListener('online', retryCover);

const outLink = (href, icon, label) => `<a class="btn" href="${esc(href)}" target="_blank" rel="noopener noreferrer"><svg aria-hidden="true"><use href="#${icon}"/></svg><span>${label}</span><svg class="ext" aria-hidden="true"><use href="#i-ext"/></svg></a>`;
let albumHTML = '';
// the dock already shows the song big, so here the work's title is big and never cut, the song small under it
function renderAlbum() {
  const c = cur(), w = c ? workOf(c) : null;
  els.album.hidden = !c;
  els.aEmpty.hidden = !!c;
  showCover(w ? w.code : '');
  let html = '';
  if (c) {
    const ly = findLyrics(c), chips = [], links = [];
    if (ly.lrc) chips.push('<span class="chip ly">LRC</span>');
    if (ly.srt) chips.push('<span class="chip ly">SRT</span>');
    if (ly.ja) chips.push('<span class="chip ly">日</span>');
    const both = !!(w.store && w.subs);   // side by side: short names, so neither is cut
    if (w.store) links.push(outLink(w.store, 'i-bag', both ? 'DLsite' : 'DLsite에서 보기'));
    if (w.subs) links.push(outLink(w.subs, 'i-cloud', both ? '자막 폴더' : '자막 폴더 열기'));
    // no work to name (a loose file): the song is the heading
    const [title, title2] = w.code || w.album[0] ? w.album : w.song, [song, song2] = w.song;
    const head = w.code ? `<span class="a-code">${esc(w.code.toUpperCase())}</span>${title ? ' ' + esc(title) : ''}` : esc(title);
    html = `<div><h2 class="a-title"${jaLang(title)}>${head}</h2>`
      + (title2 ? `<p class="a-alt"${jaLang(title2)}>${esc(title2)}</p>` : '')
      + (title !== song ? `<p class="a-song"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span><span${jaLang(song)}>${esc(song)}</span>${song2 ? `<small${jaLang(song2)}>${esc(song2)}</small>` : ''}</span></p>` : '')
      + (chips.length ? `<div class="a-chips">${chips.join('')}</div>` : '') + '</div>'

  if (dir) panelOf(t).classList.add(dir > 0 ? 'in-next' : 'in-prev');
